[package]
name = "iyucode-core"
version = "0.1.0"
edition = "2021"
authors = ["IyuCode Team"]
license = "MIT"
description = "Core infrastructure library for building production-ready Axum web applications"
repository = "https://github.com/yourusername/iyucode-core"
keywords = ["axum", "web", "api", "framework", "infrastructure"]
categories = ["web-programming::http-server"]

[lib]
name = "iyucode_core"
path = "src/lib.rs"

[dependencies]
# Web Framework
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Configuration
config = "0.15.19"
dotenvy = "0.15.7"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Authentication (使用 rust_crypto 作为加密后端，纯 Rust 实现)
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["rust_crypto"] }

# Error Handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "local-time"] }
time = { version = "0.3", features = ["local-offset", "formatting"] }

# Utilities
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
argon2 = "0.5"
regex = "1.10"
once_cell = "1.19"
